name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun scripts/check-port.ts
      - run: bun test ./scripts/check-port.test.ts
      - working-directory: skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - working-directory: skills/poteto-mode/scripts
        run: bun run test
      - working-directory: skills/poteto-mode/scripts
        run: bun run typecheck
