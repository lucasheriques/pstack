name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/check-port.ts
      - run: bun test ./scripts/check-port.test.ts
      - working-directory: skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - working-directory: skills/poteto-mode/scripts
        run: bun run test
      - working-directory: skills/poteto-mode/scripts
        run: bun run typecheck
